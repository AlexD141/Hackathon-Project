<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · What can I cook?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-links">
      <span class="account" id="account-links"></span>
      <a href="index.html#kitchen" class="btn btn-solid btn-small">Start cooking</a>
    </div>
  </nav>

  <main class="auth">
    <div class="auth-card">
      <p class="label">Your profile</p>
      <h1 class="page-title" id="auth-title">Welcome back</h1>
      <p class="muted" id="auth-sub">Sign in to load the utensils and staples you’ve saved.</p>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" class="tab" data-mode="login" aria-selected="true">Sign in</button>
        <button type="button" role="tab" class="tab" data-mode="signup" aria-selected="false">Create account</button>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="field">
          <span>Username</span>
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="show-password" id="show-password" aria-label="Show password" aria-pressed="false">
              <!-- Open eye: shown while the password is hidden -->
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Crossed-out eye: shown while the password is visible -->
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-2.6 3.6M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                <path d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>
        <p id="password-hint" class="hint" hidden>Use at least 8 characters. Usernames can use letters, numbers, dots, dashes and underscores.</p>
        <p id="auth-error" class="form-error" role="alert"></p>
        <button type="submit" class="btn btn-solid btn-large" id="auth-submit">Sign in</button>
      </form>
    </div>

    <div class="hero-art auth-art" aria-hidden="true">
      <div class="disc disc-sage"></div>
      <div class="disc disc-dust"></div>
      <div class="disc disc-lilac"></div>
      <svg class="hero-icon" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 105h140"/>
        <path d="M38 105c0 36 28 58 62 58s62-22 62-58"/>
        <path d="M80 163v8h40v-8"/>
        <path d="M150 40l-46 58"/>
        <ellipse cx="156" cy="33" rx="9" ry="14" transform="rotate(38 156 33)"/>
        <path d="M70 92c-6-14 0-30 14-36"/>
        <path d="M84 56c-2 10-8 16-16 18"/>
        <path d="M84 56c8 4 12 12 10 22"/>
        <path d="M110 96c4-10 12-16 22-16"/>
      </svg>
      <p class="hero-badge">Your kitchen,<br>saved for later</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-main">
      <div>
        <p class="label">Ready when you are</p>
        <h2>Let’s get<br>cooking</h2>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
  <script>
    // Show or hide the password when the eye button is pressed
    (() => {
      const input = document.getElementById("password");
      const button = document.getElementById("show-password");
      button.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.setAttribute("aria-pressed", show);
        button.setAttribute("aria-label", show ? "Hide password" : "Show password");
        button.querySelector(".eye-open").toggleAttribute("hidden", show);
        button.querySelector(".eye-closed").toggleAttribute("hidden", !show);
        input.focus();
      });
    })();
  </script>
</body>
</html>
